<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AION 2 Shugo Timer</title>
  <script src="sdpi-components.js"></script>
  <style>
    :root { color-scheme: dark; font: 13px system-ui, sans-serif; }
    body { margin: 0; padding: 16px; color: #e9edf3; background: #202124; }
    label { display: block; margin: 0 0 14px; color: #bfc5cf; }
    select { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 8px 9px; border: 1px solid #4c5057; border-radius: 4px; color: #f5f6f8; background: #2b2d31; font: inherit; }
    .hint { color: #c4cad4; font-size: 11px; line-height: 1.5; }
  </style>
</head>
<body>
  <label for="region">Serverregion
    <select id="region">
      <option value="eu">Europa</option>
      <option value="nae">Nordamerika Ost</option>
      <option value="naw">Nordamerika West</option>
      <option value="la">Südamerika</option>
      <option value="as">Asien</option>
    </select>
  </label>
  <p class="hint">Das Shugo-Festival startet laut aktuellem Zeitplan jede volle Stunde. Die Anmeldung ist in den ersten drei Minuten offen. Angezeigt wird die Zeit der ausgewählten Serverregion. In den letzten 30 Sekunden vor dem Start blinkt das Shugo-Logo; während der Anmeldung zeigt der Timer deren Restzeit.</p>
  <script>
    (() => {
      const client = SDPIComponents.streamDeckClient;
      const region = document.getElementById("region");
      let saveTimer;

      function applySettings(settings = {}) {
        region.value = settings.region || "eu";
      }

      async function saveSettings() {
        try {
          await client.setSettings({ region: region.value });
        } catch (error) {
          // Retry on the next selection change.
        }
      }

      region.addEventListener("change", () => {
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(saveSettings, 150);
      });
      client.didReceiveSettings.subscribe((event) => applySettings(event.payload?.settings || {}));
      client.getConnectionInfo().then((info) => applySettings(info.actionInfo?.payload?.settings || {}));
    })();
  </script>
</body>
</html>
