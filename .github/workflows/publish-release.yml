name: Publish AION 2 Stats release

on:
  push:
    branches:
      - main
    paths:
      - AION-2-Stats.sdPlugin/manifest.json

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, '[publish ')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the Stream Deck plugin
        run: |
          npm ci
          npm run package

      - name: Read the plugin version
        id: version
        run: |
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("AION-2-Stats.sdPlugin/manifest.json", "utf8")).Version')
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release and attach the installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          gh release create "v${VERSION}"
          "release/AION-2-Stats-${VERSION}.streamDeckPlugin"
          --repo "$GITHUB_REPOSITORY"
          --title "AION 2 Stats v${VERSION}"
          --notes-file "release-notes/v${VERSION}.md"
          --target "$GITHUB_SHA"
