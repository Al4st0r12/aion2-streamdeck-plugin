name: Publish AION 2 Stats v0.2.5.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.2.5.0.yml

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish v0.2.5.0]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the Stream Deck plugin
        run: |
          npm ci
          npm run package

      - name: Create the GitHub release and attach the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.2.5.0
          release/AION-2-Stats-0.2.5.0.streamDeckPlugin
          --repo "$GITHUB_REPOSITORY"
          --title "AION 2 Stats v0.2.5.0"
          --notes-file CHANGELOG.md
          --target "$GITHUB_SHA"

